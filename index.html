<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Receipts">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230a84ff'/%3E%3Ctext x='90' y='120' font-size='90' text-anchor='middle'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<title>Receipts</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
     background:#f5f5f7;color:#1a1a1a;
     padding-bottom:env(safe-area-inset-bottom);
     padding-top:env(safe-area-inset-top)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hide{display:none!important}
h2{font-size:20px;margin-bottom:4px}
p.sub{color:#666;font-size:14px;margin-bottom:16px}

/* ---------- Home ---------- */
.big{display:flex;align-items:center;gap:14px;width:100%;padding:22px;margin-bottom:12px;
     background:#fff;border:none;border-radius:16px;font-size:18px;font-weight:600;
     box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;text-align:left;
     font-family:inherit;color:#1a1a1a}
.big:active{transform:scale(.98)}
.big .ico{font-size:28px;line-height:1}
.status{text-align:center;color:#666;font-size:14px;margin-top:20px;line-height:1.8}
.link{color:#0a84ff;text-decoration:underline;cursor:pointer;background:none;
      border:none;font-size:14px;font-family:inherit}

/* ---------- Setup ---------- */
.field{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;
       font-size:15px;font-family:inherit;margin-bottom:12px;background:#fff}

/* ---------- Cards ---------- */
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;
      box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card.low{border-left:4px solid #f5a623;background:#fffdf7}
.row{display:flex;align-items:center;gap:10px}
.chk{width:24px;height:24px;flex-shrink:0;accent-color:#0a84ff}
.name{font-weight:600;flex:1;border:none;background:transparent;font-size:16px;
      font-family:inherit;min-width:0;color:#1a1a1a}
.nums{display:flex;gap:8px;align-items:center;margin:10px 0 0 34px;
      font-size:14px;color:#555;flex-wrap:wrap}
.nums input{width:72px;padding:7px 8px;border:1px solid #ddd;border-radius:8px;
            font-size:14px;text-align:right;font-family:inherit}
.nums .tot{margin-left:auto;font-weight:600;color:#1a1a1a;white-space:nowrap}
.fee{margin:6px 0 0 34px;font-size:12px;color:#888}
select{width:100%;padding:11px;margin-top:10px;border:1px solid #ddd;border-radius:10px;
       font-size:15px;background:#fff;font-family:inherit;color:#1a1a1a}
select.unset{border-color:#f5a623;color:#8a6d00;background:#fffdf7}

/* ---------- Header ---------- */
.hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.hdr input.store{flex:1;font-size:19px;font-weight:700;border:none;background:transparent;
                 font-family:inherit;min-width:120px;color:#1a1a1a}
.hdr input.date{width:112px;padding:6px 8px;border:1px solid #ddd;border-radius:8px;
                font-size:14px;font-family:inherit;text-align:center}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:7px 13px;border:1px solid #ddd;border-radius:20px;background:#fff;
      font-size:13px;white-space:nowrap;cursor:pointer;font-family:inherit;color:#1a1a1a}
.pill.on{background:#0a84ff;color:#fff;border-color:#0a84ff}
.back{background:none;border:none;font-size:22px;cursor:pointer;padding:0 4px 0 0;
      color:#0a84ff;line-height:1}

/* ---------- Meta ---------- */
.meta{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;
      box-shadow:0 1px 3px rgba(0,0,0,.07)}
.meta label{display:block;font-size:12px;color:#888;margin:10px 0 4px;
            text-transform:uppercase;letter-spacing:.3px}
.meta label:first-child{margin-top:0}
.meta input{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;
            font-size:15px;font-family:inherit}
.combo{display:flex;gap:6px}
.combo input{flex:1}
.combo select{width:44px;margin-top:0;padding:10px 4px;flex-shrink:0}

/* ---------- Reconciliation ---------- */
.recon{padding:11px 13px;border-radius:10px;font-size:14px;margin-bottom:10px;
       font-weight:500}
.recon.ok{background:#e8f5e9;color:#1b5e20}
.recon.warn{background:#ffebee;color:#b71c1c}

/* ---------- Action bar ---------- */
.bar{position:sticky;bottom:0;background:#f5f5f7;padding:12px 0 16px;
     border-top:1px solid #e0e0e0;margin-top:14px}
.btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:17px;
     font-weight:600;background:#0a84ff;color:#fff;cursor:pointer;font-family:inherit}
.btn:disabled{background:#c7c7cc;cursor:default}
.btn:active:not(:disabled){transform:scale(.99)}
.btn.sec{background:#fff;color:#0a84ff;border:1px solid #d0d0d5;margin-bottom:8px;
         padding:13px;font-size:15px}
.btn.ghost{background:none;color:#666;border:none;padding:10px;font-size:14px;
           margin-top:4px}

/* ---------- Spinner ---------- */
.spin{text-align:center;padding:70px 20px}
.spin .ring{width:42px;height:42px;margin:0 auto 18px;border:3px solid #e0e0e0;
            border-top-color:#0a84ff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.spin p{color:#666;font-size:15px}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);
       background:#1a1a1a;color:#fff;padding:12px 20px;border-radius:24px;
       font-size:14px;z-index:99;max-width:90%;text-align:center;
       box-shadow:0 4px 14px rgba(0,0,0,.25)}
.toast.err{background:#b71c1c}

/* ---------- Preview ---------- */
.preview{width:100%;border-radius:12px;margin-bottom:12px;max-height:220px;
         object-fit:cover;display:block}
</style>
</head>
<body>
<div class="wrap">

  <!-- SETUP -->
  <section id="vSetup" class="hide">
    <h2>Connect your sheet</h2>
    <p class="sub">Paste the Apps Script Web App URL from your Google Sheet.</p>
    <input id="scriptUrl" class="field" type="url" inputmode="url"
           autocapitalize="off" autocorrect="off" spellcheck="false"
           placeholder="https://script.google.com/macros/s/.../exec">
    <button id="btnConnect" class="btn">Connect</button>
    <p class="status">Apps Script → Deploy → Manage deployments → copy Web app URL</p>
  </section>

  <!-- HOME -->
  <section id="vHome" class="hide">
    <h2>Receipts</h2>
    <p class="sub">Capture a purchase</p>
    <button class="big" id="btnCam"><span class="ico">📷</span> Scan Receipt</button>
    <button class="big" id="btnLib"><span class="ico">🖼️</span> From Photos</button>
    <div class="status">
      <span id="homeStatus">Ready</span><br>
      <button class="link" id="btnReset">Change sheet connection</button>
    </div>
  </section>

  <!-- WORKING -->
  <section id="vWork" class="hide">
    <div class="spin">
      <div class="ring"></div>
      <p id="workMsg">Reading receipt…</p>
    </div>
  </section>

  <!-- ERROR -->
  <section id="vError" class="hide">
    <h2>Couldn't read that</h2>
    <p class="sub" id="errMsg"></p>
    <img id="errImg" class="preview hide" alt="">
    <button class="btn sec" id="btnRetake">📷 Retake photo</button>
    <button class="btn sec" id="btnManual">✏️ Enter manually</button>
    <button class="btn ghost" id="btnCancelErr">Cancel</button>
  </section>

  <!-- REVIEW -->
  <section id="vReview" class="hide">
    <div class="hdr">
      <button class="back" id="btnBack">‹</button>
      <input class="store" id="fStore" placeholder="Store name" list="storeList">
      <datalist id="storeList"></datalist>
      <input class="date" id="fDate" placeholder="DD/MM/YYYY" inputmode="numeric">
    </div>
    <div class="pills">
      <button class="pill" id="pChannel">In person</button>
      <button class="pill" id="pMethod">Collection</button>
      <button class="pill" id="pShared">Not shared</button>
    </div>

    <div id="recon" class="recon ok"></div>
    <div id="items"></div>

    <div class="meta">
      <label>Order / receipt number</label>
      <input id="fOrder" placeholder="Optional">
      <label>Payment method</label>
      <div class="combo">
        <input id="fPay" placeholder="e.g. Visa ••4521">
        <select id="payPick" aria-label="Saved payment methods"></select>
      </div>
      <label>Notes (applies to all lines)</label>
      <input id="fNotes" placeholder="Optional">
    </div>

    <div class="bar">
      <button class="btn sec" id="btnSelAll">Select all</button>
      <button class="btn sec" id="btnBulk">Set purpose for selected</button>
      <button class="btn" id="btnSave">Save to Sheet</button>
    </div>
  </section>

</div>

<input type="file" id="inpCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="inpLib" accept="image/*" class="hide">

<script src="app.js"></script>
</body>
</html>
